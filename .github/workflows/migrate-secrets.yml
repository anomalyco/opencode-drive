name: Migrate secrets

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: catalog-production
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::604439173067:role/github/opencode-drive-catalog-production
          role-session-name: opencode-drive-migrate-${{ github.run_id }}
          aws-region: us-east-1
      - name: Copy CLOUDFLARE_API_TOKEN
        env:
          V: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: aws secretsmanager put-secret-value --secret-id opencode-drive/catalog-production/CLOUDFLARE_API_TOKEN --secret-string "$V" > /dev/null
