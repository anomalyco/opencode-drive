name: Deploy terminal catalog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-catalog.yml"
      - "bun.lock"
      - "package.json"
      - "packages/drive/**"
      - "apps/catalog/**"
  workflow_dispatch:

concurrency:
  group: deploy-terminal-catalog-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.repository == 'anomalyco/opencode-drive' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: catalog-production
      url: https://dev.opencode.ai/lab/catalog
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: bun install --frozen-lockfile

      - name: Validate
        run: |
          bun run --cwd packages/drive check
          bun run --cwd packages/drive test
          bun run --cwd apps/catalog check

      - name: Deploy
        working-directory: apps/catalog
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Verify deployment
        run: curl --fail --retry 5 --retry-all-errors --retry-delay 2 --silent --show-error --output /dev/null https://dev.opencode.ai/lab/catalog
